---
# Run ONLY from a separate admin host / break-glass identity.
# Application backup hosts must not receive delete permissions on the S3 bucket.
#
# Example:
#   ansible-playbook -i ansible/inventories/staging/hosts.ini \
#     ansible/playbooks/backup-retention.yml --check --diff

- name: Apply Restic retention (forget --prune) from admin context
  hosts: backup_admin
  become: true
  vars:
    # Prefer secondary (offsite) repo; fall back to primary without self-reference.
    retention_repo: "{{ restic_secondary_repo_path | default(restic_primary_repo_path | default(restic_local_repo_path), true) }}"
  tasks:
    - name: Require restic password
      ansible.builtin.assert:
        that:
          - restic_password | length >= 20
        fail_msg: "Provide vault_restic_password for retention runs."
      no_log: true

    - name: Require retention repository path
      ansible.builtin.assert:
        that:
          - retention_repo is string
          - retention_repo | length > 0
        fail_msg: "Set restic_secondary_repo_path or restic_primary_repo_path / restic_local_repo_path."

    - name: Apply forget and prune
      ansible.builtin.command:
        argv:
          - restic
          - forget
          - --repo
          - "{{ retention_repo }}"
          - --password-file
          - "{{ restic_password_file }}"
          - --keep-hourly
          - "{{ restic_keep_hourly }}"
          - --keep-daily
          - "{{ restic_keep_daily }}"
          - --keep-weekly
          - "{{ restic_keep_weekly }}"
          - --keep-monthly
          - "{{ restic_keep_monthly }}"
          - --prune
      environment: "{{ restic_s3_environment | default({}) }}"
      no_log: true
