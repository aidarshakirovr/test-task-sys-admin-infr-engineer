---
# Production: keep an offsite copy after every backup.
restic_copy_enabled: true
restic_backend: "local"
restic_secondary_backend: "s3"
restic_secondary_repo_path: "s3:{{ s3_endpoint }}/{{ s3_bucket }}-offsite"
# Require vault_restic_secondary_password != vault_restic_password (validated when env=production).

# App-host IAM: DeleteObject only under locks/; deny delete on data. Object Lock must be
# verified manually — this role does not configure it (docs/S3_OBJECT_LOCK_AND_IAM.md).
