---
- name: Deploy host hardening baseline
  hosts: backup_servers:app_servers
  become: true
  roles:
    - role: host_hardening
      tags: [hardening]

- name: Deploy Restic Backup Solution
  hosts: backup_servers
  become: true
  roles:
    - role: backup_restic
      tags: [backup]

- name: Deploy example docker compose app
  hosts: app_servers
  become: true
  tags: [app, compose]
  tasks:
    - name: Ensure compose project directory exists
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/compose.yaml"
        dest: /opt/app/compose.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Deploy compose env for publish port/IP
      ansible.builtin.copy:
        dest: /opt/app/.env
        owner: root
        group: root
        mode: "0644"
        content: |
          APP_PUBLISH_IP={{ app_publish_ip | default('127.0.0.1') }}
          APP_PUBLISH_PORT={{ app_publish_port | default(hardening_app_port | default('8080')) }}

    - name: Check docker compose availability
      ansible.builtin.command:
        argv: [docker, compose, version]
      register: docker_compose_version
      changed_when: false
      failed_when: docker_compose_version.rc != 0

    - name: Start compose stack
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/app/compose.yaml, --env-file, /opt/app/.env, up, -d]
      register: compose_up
      changed_when: >-
        ('Started' in (compose_up.stdout | default(''))) or
        ('Created' in (compose_up.stdout | default(''))) or
        (compose_up.rc == 0)
