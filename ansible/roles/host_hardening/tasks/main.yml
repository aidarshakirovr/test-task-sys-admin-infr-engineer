---
- name: Build hardening package list
  ansible.builtin.set_fact:
    hardening_packages: "{{ ['ufw'] + (['fail2ban'] if hardening_enable_fail2ban | bool else []) + (['unattended-upgrades'] if hardening_enable_unattended_upgrades | bool else []) + (['auditd'] if hardening_enable_auditd | bool else []) }}"

- name: Install base hardening packages
  ansible.builtin.apt:
    name: "{{ hardening_packages }}"
    state: present
    update_cache: true

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Resolve deploy user home for authorized_keys check
  ansible.builtin.getent:
    database: passwd
    key: "{{ hardening_ssh_deploy_user }}"
  register: hardening_deploy_passwd
  failed_when: false

- name: Stat deploy user authorized_keys
  ansible.builtin.stat:
    path: "{{ hardening_deploy_passwd.ansible_facts.getent_passwd[hardening_ssh_deploy_user][4] }}/.ssh/authorized_keys"
  register: hardening_authorized_keys
  when:
    - hardening_deploy_passwd.ansible_facts.getent_passwd is defined
    - hardening_ssh_deploy_user in hardening_deploy_passwd.ansible_facts.getent_passwd

- name: Decide whether password authentication may be disabled
  ansible.builtin.set_fact:
    hardening_disable_password_auth: "{{ (hardening_ssh_password_authentication | string) == 'no' and (hardening_authorized_keys is defined) and (hardening_authorized_keys.stat is defined) and (hardening_authorized_keys.stat.exists | default(false)) and ((hardening_authorized_keys.stat.size | default(0)) | int > 0) }}"

- name: Warn when PasswordAuthentication cannot be disabled safely
  ansible.builtin.debug:
    msg: >-
      Skipping PasswordAuthentication=no: no non-empty authorized_keys for
      {{ hardening_ssh_deploy_user }}. Fix keys first to avoid lockout.
  when:
    - (hardening_ssh_password_authentication | string) == 'no'
    - not (hardening_disable_password_auth | bool)

- name: Deploy sshd hardening drop-in
  ansible.builtin.copy:
    dest: "{{ hardening_sshd_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f /etc/ssh/sshd_config"
    content: |
      # Managed by ansible role host_hardening
      PermitRootLogin {{ hardening_ssh_permit_root_login }}
      PubkeyAuthentication {{ hardening_ssh_pubkey_authentication }}
      PasswordAuthentication {{ 'no' if (hardening_disable_password_auth | bool) else 'yes' }}
  notify: Restart ssh

- name: Allow required UFW ports before enable
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ hardening_ufw_allow }}"
  when: hardening_ufw_enabled | bool

- name: Enable UFW default deny incoming
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
  when: hardening_ufw_enabled | bool

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  when: hardening_ufw_enabled | bool

- name: Persist DOCKER-USER allows in UFW after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED DOCKER-USER"
    create: true
    mode: "0640"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      {% for item in hardening_ufw_allow if item.proto == 'tcp' %}
      -A DOCKER-USER -p tcp --dport {{ item.port }} -j ACCEPT
      {% endfor %}
      -A DOCKER-USER -j RETURN
      COMMIT
  when:
    - hardening_docker_user_rules | bool
    - hardening_ufw_enabled | bool
  notify: Reload ufw

- name: Apply runtime DOCKER-USER allows (until reboot / ufw reload)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: "{{ item.proto | default(omit) }}"
    destination_port: "{{ item.port | default(omit) }}"
    ctstate: "{{ item.ctstate | default(omit) }}"
    jump: ACCEPT
    action: insert
  loop:
    - { ctstate: "ESTABLISHED,RELATED" }
    - { proto: "tcp", port: "{{ hardening_app_port }}" }
  when: hardening_docker_user_rules | bool
  failed_when: false

- name: Apply baseline sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: hardening_enable_fail2ban | bool

- name: Enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  when: hardening_enable_unattended_upgrades | bool

- name: Enable auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: hardening_enable_auditd | bool

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read existing Docker daemon.json for merge
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: hardening_daemon_json_existing
  failed_when: false

- name: Build merged Docker daemon.json
  ansible.builtin.set_fact:
    hardening_daemon_json_merged: "{{ (hardening_daemon_json_existing.content | default('') | b64decode | default('{}', true) | from_json | default({})) | combine(hardening_docker_daemon_json, recursive=True) }}"

# NOTE: handler restarts Docker and stops containers — maintenance window required.
# default-address-pools only affect NEW networks; recreate overlapping ones manually.
- name: Deploy merged Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ hardening_daemon_json_merged | to_nice_json }}\n"
  notify: Restart docker
