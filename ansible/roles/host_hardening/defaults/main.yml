---
hardening_ssh_permit_root_login: "no"
hardening_ssh_password_authentication: "no"
hardening_ssh_pubkey_authentication: "yes"
# Deploy user whose authorized_keys must exist before PasswordAuthentication=no.
hardening_ssh_deploy_user: "{{ ansible_user | default('deployer') }}"
hardening_sshd_dropin_path: "/etc/ssh/sshd_config.d/99-hardening.conf"

# Published application port (compose maps host:container).
hardening_app_port: "8080"
app_publish_port: "{{ hardening_app_port }}"

# Allow required access BEFORE enabling UFW to avoid lockout.
hardening_ufw_enabled: true
hardening_ufw_allow:
  - { port: "22", proto: "tcp", comment: "SSH" }
  - { port: "{{ hardening_app_port }}", proto: "tcp", comment: "app published port" }

# Persist DOCKER-USER allowances across reboot via /etc/ufw/after.rules.
hardening_docker_user_rules: true

hardening_enable_fail2ban: true
hardening_enable_unattended_upgrades: true
hardening_enable_auditd: true
hardening_sysctl:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0

# Restarting Docker (handler) stops running containers — schedule a maintenance window.
# default-address-pools applies only to NEW networks; recreate overlapping ones manually.
hardening_docker_restart_note: >-
  Changing daemon.json notifies a Docker restart, which stops containers.
  Apply during a maintenance window. default-address-pools does not rewrite
  existing bridge networks; remove/recreate networks that still overlap the LAN.
hardening_docker_daemon_json:
  default-address-pools:
    - base: "172.30.0.0/16"
      size: 24
  log-driver: "json-file"
  log-opts:
    max-size: "50m"
    max-file: "5"
