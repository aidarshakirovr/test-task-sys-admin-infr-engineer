---
- name: Validate backup configuration
  ansible.builtin.assert:
    that:
      - restic_backend in ['local', 's3']
      - restic_password | length >= 20
      - backup_source_dir is match('^/')
      - restic_repo_path is string
      - restic_repo_path | length > 0
      - restic_rpo_hours | int > 0
    fail_msg: >-
      Configure a strong restic password in Ansible Vault, an absolute source
      directory, and a supported repository backend.
  no_log: true

- name: Validate S3 credentials when S3 backend is selected
  ansible.builtin.assert:
    that:
      - aws_access_key | length > 0
      - aws_secret_key | length > 0
      - s3_bucket | length > 0
      - s3_endpoint is match('^[A-Za-z0-9.-]+(:[0-9]+)?$')
    fail_msg: "S3 backend requires Vault credentials, bucket, and a hostname-only endpoint."
  no_log: true
  when: restic_backend == 's3' or (restic_copy_enabled | bool and restic_secondary_backend == 's3')

- name: Validate secondary repository when copy is enabled
  ansible.builtin.assert:
    that:
      - restic_secondary_repo_path is string
      - restic_secondary_repo_path | length > 0
      - restic_secondary_repo_path != restic_repo_path
    fail_msg: "restic_copy_enabled requires a distinct restic_secondary_repo_path."
  when: restic_copy_enabled | bool

- name: Build S3 environment for restic commands
  ansible.builtin.set_fact:
    restic_s3_environment: "{{ {'AWS_ACCESS_KEY_ID': aws_access_key, 'AWS_SECRET_ACCESS_KEY': aws_secret_key} if (restic_backend == 's3' or (restic_copy_enabled | bool and restic_secondary_backend == 's3')) else {} }}"
  no_log: true
