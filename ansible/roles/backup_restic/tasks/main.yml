---

- name: Validate backup configuration
  ansible.builtin.import_tasks: validate.yml

- name: Validate that restic password is provided
  ansible.builtin.assert:
    that:
      - restic_password | length > 0
    fail_msg: "CRITICAL: restic_password must be passed via Vault or Ansible vars"
  no_log: true

- name: Install restic package (optional version pin)
  ansible.builtin.apt:
    name: "{{ 'restic=' ~ restic_package_version if restic_package_version | length > 0 else 'restic' }}"
    state: present
    update_cache: true
    allow_downgrade: "{{ restic_package_version | length > 0 }}"

- name: Create backup system group
  ansible.builtin.group:
    name: "{{ restic_group }}"
    system: true
    state: present

- name: Create backup system user
  ansible.builtin.user:
    name: "{{ restic_user }}"
    group: "{{ restic_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create secure restic configuration directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: "{{ restic_group }}"
    mode: "0750"

- name: Deploy restic password file with 0640 permissions
  ansible.builtin.copy:
    content: "{{ restic_password }}\n"
    dest: "{{ restic_password_file }}"
    owner: root
    group: "{{ restic_group }}"
    mode: "0640"
  no_log: true

- name: Deploy secondary restic password file
  ansible.builtin.copy:
    content: "{{ restic_secondary_password }}\n"
    dest: "{{ restic_secondary_password_file }}"
    owner: root
    group: "{{ restic_group }}"
    mode: "0640"
  no_log: true
  when: restic_copy_enabled | bool

- name: Create local backup repository directory
  ansible.builtin.file:
    path: "{{ restic_local_repo_path }}"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0750"
  when: restic_backend == "local"

- name: Create dedicated restic cache directory
  ansible.builtin.file:
    path: "{{ restic_cache_dir }}"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: "0750"

- name: Ensure backup source directory exists without overriding mode
  ansible.builtin.file:
    path: "{{ backup_source_dir }}"
    state: directory

- name: Deploy AWS credentials env file for S3 backends
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ aws_access_key }}
      AWS_SECRET_ACCESS_KEY={{ aws_secret_key }}
    dest: "{{ restic_aws_env_file }}"
    owner: root
    group: "{{ restic_group }}"
    mode: "0640"
  no_log: true
  when: restic_backend == "s3" or (restic_copy_enabled | bool and restic_secondary_backend == "s3")

- name: Probe primary restic repository
  ansible.builtin.command:
    argv:
      - restic
      - snapshots
      - --repo
      - "{{ restic_repo_path }}"
      - --password-file
      - "{{ restic_password_file }}"
      - --cache-dir
      - "{{ restic_cache_dir }}"
  environment: "{{ restic_s3_environment }}"
  become: true
  become_user: "{{ restic_user }}"
  register: restic_repo_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Classify primary repository probe result
  ansible.builtin.set_fact:
    restic_primary_missing: "{{ restic_repo_probe.rc != 0 and ((restic_repo_probe.stderr | default('') ~ ' ' ~ restic_repo_probe.stdout | default('')) is search('Is not a restic repository|does not exist|config file does not exist|unable to open config file|no such file or directory', ignorecase=True)) }}"

- name: Fail when primary repo probe failed for non-missing reasons
  ansible.builtin.fail:
    msg: >-
      Primary restic repository probe failed (auth, network, or other error).
      Refusing to run restic init. Fix credentials/connectivity, then re-run.
  when:
    - restic_repo_probe.rc != 0
    - not (restic_primary_missing | bool)

- name: Initialize primary restic repository only if missing
  ansible.builtin.command:
    argv:
      - restic
      - init
      - --repo
      - "{{ restic_repo_path }}"
      - --password-file
      - "{{ restic_password_file }}"
      - --cache-dir
      - "{{ restic_cache_dir }}"
  environment: "{{ restic_s3_environment }}"
  become: true
  become_user: "{{ restic_user }}"
  when: restic_primary_missing | bool
  no_log: true

- name: Probe secondary restic repository
  ansible.builtin.command:
    argv:
      - restic
      - snapshots
      - --repo
      - "{{ restic_secondary_repo_path }}"
      - --password-file
      - "{{ restic_secondary_password_file }}"
      - --cache-dir
      - "{{ restic_cache_dir }}"
  environment: "{{ restic_s3_environment }}"
  become: true
  become_user: "{{ restic_user }}"
  register: restic_secondary_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: restic_copy_enabled | bool

- name: Classify secondary repository probe result
  ansible.builtin.set_fact:
    restic_secondary_missing: "{{ restic_secondary_probe.rc != 0 and ((restic_secondary_probe.stderr | default('') ~ ' ' ~ restic_secondary_probe.stdout | default('')) is search('Is not a restic repository|does not exist|config file does not exist|unable to open config file|no such file or directory', ignorecase=True)) }}"
  when: restic_copy_enabled | bool

- name: Fail when secondary repo probe failed for non-missing reasons
  ansible.builtin.fail:
    msg: >-
      Secondary restic repository probe failed (auth, network, or other error).
      Refusing to run restic init on the secondary repo.
  when:
    - restic_copy_enabled | bool
    - restic_secondary_probe.rc is defined
    - restic_secondary_probe.rc != 0
    - not (restic_secondary_missing | bool)

- name: Initialize secondary restic repository only if missing
  ansible.builtin.command:
    argv:
      - restic
      - init
      - --repo
      - "{{ restic_secondary_repo_path }}"
      - --password-file
      - "{{ restic_secondary_password_file }}"
      - --cache-dir
      - "{{ restic_cache_dir }}"
  environment: "{{ restic_s3_environment }}"
  become: true
  become_user: "{{ restic_user }}"
  when:
    - restic_copy_enabled | bool
    - restic_secondary_missing | default(false) | bool
  no_log: true

- name: Deploy backup script
  ansible.builtin.template:
    src: backup-app.sh.j2
    dest: /usr/local/bin/backup-app.sh
    owner: root
    group: "{{ restic_group }}"
    mode: "0750"

- name: Deploy repository check script
  ansible.builtin.template:
    src: restic-check.sh.j2
    dest: /usr/local/bin/restic-check.sh
    owner: root
    group: "{{ restic_group }}"
    mode: "0750"

- name: Deploy RPO age check script
  ansible.builtin.template:
    src: restic-rpo-check.sh.j2
    dest: /usr/local/bin/restic-rpo-check.sh
    owner: root
    group: "{{ restic_group }}"
    mode: "0750"

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: app-backup.service.j2
    dest: /etc/systemd/system/app-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy backup failure alert unit
  ansible.builtin.template:
    src: app-backup-failure.service.j2
    dest: /etc/systemd/system/app-backup-failure.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy systemd timer unit
  ansible.builtin.template:
    src: app-backup.timer.j2
    dest: /etc/systemd/system/app-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backup timer

- name: Deploy weekly restic check service
  ansible.builtin.template:
    src: app-backup-check.service.j2
    dest: /etc/systemd/system/app-backup-check.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy weekly restic check timer
  ansible.builtin.template:
    src: app-backup-check.timer.j2
    dest: /etc/systemd/system/app-backup-check.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart check timer

- name: Deploy RPO check service
  ansible.builtin.template:
    src: app-backup-rpo.service.j2
    dest: /etc/systemd/system/app-backup-rpo.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy RPO check timer
  ansible.builtin.template:
    src: app-backup-rpo.timer.j2
    dest: /etc/systemd/system/app-backup-rpo.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart rpo timer

- name: Ensure backup timer is enabled and active
  ansible.builtin.systemd:
    name: app-backup.timer
    state: started
    enabled: true

- name: Ensure weekly check timer is enabled and active
  ansible.builtin.systemd:
    name: app-backup-check.timer
    state: started
    enabled: true

- name: Ensure RPO check timer is enabled and active
  ansible.builtin.systemd:
    name: app-backup-rpo.timer
    state: started
    enabled: true
