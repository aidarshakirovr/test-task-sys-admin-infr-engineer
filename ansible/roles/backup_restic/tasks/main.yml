---
- name: Validate restic password is provided
  ansible.builtin.assert:
    that:
      - restic_password | length > 0
    fail_msg: "ERROR: restic_password must be passed via Ansible Vault or --extra-vars 'restic_password=...'"

- name: Install required packages
  ansible.builtin.apt:
    name: [restic, acl]
    state: present
    update_cache: yes

- name: Create backup group
  ansible.builtin.group:
    name: "{{ restic_group }}"
    system: yes
    state: present

- name: Create backup system user
  ansible.builtin.user:
    name: "{{ restic_user }}"
    group: "{{ restic_group }}"
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    state: present

- name: Create secure restic config directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: "{{ restic_group }}"
    mode: '0750'

- name: Deploy restic password file with 0640 permissions
  ansible.builtin.copy:
    content: "{{ restic_password }}\n"
    dest: "{{ restic_password_file }}"
    owner: root
    group: "{{ restic_group }}"
    mode: '0640'

- name: Create backup repository directory
  ansible.builtin.file:
    path: "{{ restic_repo_path }}"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_group }}"
    mode: '0750'

- name: Ensure source directory exists
  ansible.builtin.file:
    path: "{{ backup_source_dir }}"
    state: directory
    mode: '0755'

- name: Apply POSIX ACL (rX) on source directory
  ansible.posix.acl:
    path: "{{ backup_source_dir }}"
    entity: "{{ restic_user }}"
    etype: user
    permissions: "rX"
    state: present
    recursive: yes

- name: Apply default POSIX ACL for inheritance on new files
  ansible.posix.acl:
    path: "{{ backup_source_dir }}"
    entity: "{{ restic_user }}"
    etype: user
    permissions: "rX"
    state: present
    default: yes
    recursive: yes

- name: Check if restic repository is initialized
  ansible.builtin.stat:
    path: "{{ restic_repo_path }}/config"
  register: restic_repo_config

- name: Initialize restic repository if not present
  ansible.builtin.command: >
    restic init --repo "{{ restic_repo_path }}" --password-file "{{ restic_password_file }}"
  become: yes
  become_user: "{{ restic_user }}"
  when: not restic_repo_config.stat.exists

- name: Deploy backup script
  ansible.builtin.template:
    src: backup-app.sh.j2
    dest: /usr/local/bin/backup-app.sh
    owner: root
    group: "{{ restic_group }}"
    mode: '0750'

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: app-backup.service.j2
    dest: /etc/systemd/system/app-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Deploy systemd timer unit
  ansible.builtin.template:
    src: app-backup.timer.j2
    dest: /etc/systemd/system/app-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart backup timer

- name: Ensure backup timer is enabled and active
  ansible.builtin.systemd:
    name: app-backup.timer
    state: started
    enabled: yes
