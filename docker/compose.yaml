services:
  web-service:
    image: nginx:alpine
    container_name: web-service-prod
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
