services:
  web-service:
    image: nginx:alpine
    container_name: web-service-prod
    restart: unless-stopped
    ports:
      # Lab default binds localhost; override via .env APP_PUBLISH_IP / APP_PUBLISH_PORT
      - "${APP_PUBLISH_IP:-127.0.0.1}:${APP_PUBLISH_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
